<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      button {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 15px;
        background: rgba(18,18,18,.94);
        color: #fff;
        box-shadow: 0 12px 38px rgba(0,0,0,.42);
        cursor: pointer;
        font: 26px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      }
      button:hover { background: rgba(36,36,36,.98); }
      button:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
      .overview-icon {
        width: 19px;
        height: 19px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 3px;
      }
      .overview-icon span { border: 1.8px solid currentColor; border-radius: 2px; }
    </style>
    <title>Browser controls</title>
  </head>
  <body>
    <button id="action" type="button" aria-label="New page" title="New page (Ctrl/Cmd+T)">+</button>
    <script src="controls.js"></script>
  </body>
</html>
