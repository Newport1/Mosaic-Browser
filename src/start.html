<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f4f1;
        color: #161616;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { max-width: 560px; text-align: center; }
      .mark {
        width: 54px;
        height: 54px;
        margin: 0 auto 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 8px;
        border: 2px solid #161616;
        border-radius: 16px;
      }
      .mark span { background: #161616; border-radius: 3px; }
      h1 { margin: 0 0 8px; font-size: clamp(22px, 4vw, 38px); letter-spacing: -.035em; }
      p { margin: 0; color: #686868; line-height: 1.45; font-size: 14px; }
    </style>
    <title>New page</title>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1>New page</h1>
      <p>Enter an address above. Add pages and the workspace will keep retiling.</p>
    </main>
  </body>
</html>
