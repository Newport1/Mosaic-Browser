<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mosaic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="chrome">
    <div class="brand" aria-label="Mosaic"><span class="mark">M</span><strong>Mosaic</strong></div>
    <nav class="controls" aria-label="Page navigation">
      <button id="back" type="button" aria-label="Back">←</button>
      <button id="forward" type="button" aria-label="Forward">→</button>
      <button id="reload" type="button" aria-label="Reload">↻</button>
    </nav>
    <form id="addressForm">
      <span class="secure" aria-hidden="true">●</span>
      <input id="address" aria-label="Address" autocomplete="off" spellcheck="false" placeholder="Search or enter an address">
      <kbd>⌘ L</kbd>
    </form>
    <span class="count" id="count" aria-live="polite">1 page</span>
    <button class="close" id="close" type="button" aria-label="Close active page">×</button>
  </header>
  <main aria-hidden="true"></main>
  <script src="renderer.js"></script>
</body>
</html>
