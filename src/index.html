<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mosaic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="browser-toolbar">
    <nav class="navigation-controls" aria-label="Page navigation">
      <button class="icon-button" id="back" type="button" aria-label="Back" title="Back">
        <svg aria-hidden="true"><use href="icons.svg#arrow-left"></use></svg>
      </button>
      <button class="icon-button" id="forward" type="button" aria-label="Forward" title="Forward">
        <svg aria-hidden="true"><use href="icons.svg#arrow-right"></use></svg>
      </button>
      <button class="icon-button" id="reload" type="button" aria-label="Reload" title="Reload">
        <svg aria-hidden="true"><use id="reloadIcon" href="icons.svg#rotate-cw"></use></svg>
      </button>
    </nav>

    <form id="addressForm" class="address-bar">
      <svg class="site-controls-icon" aria-hidden="true"><use href="icons.svg#search"></use></svg>
      <input id="address" aria-label="Address and search" autocomplete="off" autocapitalize="off"
        spellcheck="false" placeholder="Search or enter address">
    </form>

    <div class="window-controls" aria-label="Window and tab controls">
      <button class="icon-button" id="add" type="button" aria-label="New tab" title="New tab">
        <svg aria-hidden="true"><use href="icons.svg#plus"></use></svg>
      </button>
      <span class="tab-count" id="count" aria-live="polite" title="1 tab open">1</span>
      <button class="icon-button close-button" id="close" type="button" aria-label="Close tab"
        title="Close tab · Right-click to close Mosaic">
        <svg aria-hidden="true"><use href="icons.svg#x"></use></svg>
      </button>
    </div>
  </header>
  <main aria-hidden="true"></main>
  <script src="renderer.js"></script>
</body>
</html>
