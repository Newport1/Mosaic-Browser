<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="tile-chrome.css" />
    <title>Tile controls</title>
  </head>
  <body>
    <header id="chrome">
      <button id="back" class="nav-button" type="button" aria-label="Back" title="Back">←</button>
      <button id="forward" class="nav-button" type="button" aria-label="Forward" title="Forward">→</button>
      <button id="reload" class="nav-button" type="button" aria-label="Reload" title="Reload">↻</button>

      <label class="address-shell">
        <span class="sr-only">Address</span>
        <input
          id="address"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Search or enter address"
        />
      </label>

      <span id="count" aria-hidden="true"></span>
      <button id="close" class="nav-button close" type="button" aria-label="Close page" title="Close page">×</button>
    </header>

    <button id="hit-target" type="button" aria-label="Open this page fullscreen"></button>
    <script src="tile-chrome.js"></script>
  </body>
</html>
