<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosaic</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="chrome">
    <div class="topline">
      <div class="brand"><span class="mark">M</span><strong>Mosaic</strong><span class="tag">FOCUS BROWSER</span></div>
      <div class="tabs" id="tabs"></div>
      <button class="add" id="add" title="Add tile">＋ <span>Tile</span></button>
    </div>
    <div class="nav">
      <div class="controls"><button id="back" aria-label="Back">←</button><button id="forward" aria-label="Forward">→</button><button id="reload" aria-label="Reload">↻</button></div>
      <form id="addressForm"><span class="secure">●</span><input id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter an address"><kbd>⌘ L</kbd></form>
      <div class="hint"><span id="count">1 / 4 tiles</span><i></i><span>⌘ T to split</span></div>
    </div>
  </header>
  <main class="empty"><div class="empty-card"><span class="mark large">M</span><h1>Your work, side by side.</h1><p>Add up to four tiles and keep every part of your day in view.</p></div></main>
  <script src="renderer.js"></script>
</body></html>
