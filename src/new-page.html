<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>New tab</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --background: #f7f7f7;
      --text: #202020;
      --muted: #707070;
    }

    @media (prefers-color-scheme: dark) {
      :root { --background: #171717; --text: #ededed; --muted: #989898; }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      text-align: center;
    }

    main { padding: 24px; }
    h1 { margin: 0 0 9px; font-size: clamp(22px, 4vw, 34px); font-weight: 500; letter-spacing: -0.03em; }
    p { margin: 0; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Mosaic</h1>
    <p>Search or enter an address above.</p>
  </main>
</body>
</html>
