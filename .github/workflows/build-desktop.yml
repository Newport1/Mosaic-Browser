name: Build desktop installers

on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run check

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
          - label: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ad-hoc-signed macOS test release
        if: runner.os == 'macOS'
        run: npm run dist:mac:ci
        env:
          CSC_FOR_PULL_REQUEST: true
      - name: Build Windows release
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Verify macOS app signature and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Mosaic.app
          hdiutil verify dist/Mosaic-*-mac-arm64.dmg
      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Mosaic-macOS-Apple-Silicon-DMG
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS application archive
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Mosaic-macOS-Apple-Silicon-App
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Mosaic-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
